# Copy this file into your repo as .github/workflows/refresh-review-corpus.yml
#
# Keeps the committed review history fresh and reports which review rules
# need attention — without an API key and without rewriting any rule.
# On a schedule (or on demand) it:
#   1. fetches new PR review comments with the workflow's GITHUB_TOKEN;
#   2. re-publishes .reviewlore-corpus.json (unchanged when no new comments);
#   3. runs `reviewlore rules status` against it;
#   4. opens or updates a PR with the corpus, using the status report as the
#      PR description.
# Rules are refreshed by a developer running the learn-from-reviews skill in
# Claude Code, which reads the same report and proposes each change.

name: Refresh review history

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      months:
        description: "Lookback window (months)"
        default: "6"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      MONTHS: ${{ github.event.inputs.months || '6' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install reviewlore
        run: npm install -g reviewlore

      - name: Restore reviewlore's cache from earlier runs
        uses: actions/cache@v4
        with:
          path: ~/.reviewlore
          key: reviewlore-${{ github.repository }}-${{ github.run_id }}
          restore-keys: reviewlore-${{ github.repository }}-

      - name: Seed the cache from the committed corpus
        run: |
          if [ -f .reviewlore-corpus.json ] && [ ! -f ~/.reviewlore/"${OWNER}__${REPO}.json" ]; then
            mkdir -p ~/.reviewlore
            cp .reviewlore-corpus.json ~/.reviewlore/"${OWNER}__${REPO}.json"
          fi

      - name: Fetch new review comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: reviewlore fetch --owner "$OWNER" --repo "$REPO" --cache --no-output --months "$MONTHS"

      - name: Publish the corpus (left as it was when nothing changed)
        run: reviewlore publish-corpus --owner "$OWNER" --repo "$REPO" --target . --force

      - name: Check the rules against it
        id: status
        run: |
          reviewlore rules status --months "$MONTHS" > "$RUNNER_TEMP/status.md"
          n=$(reviewlore rules status --months "$MONTHS" --json | node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8")).stats; console.log(s.update + s.review_retire + s.check + s.dismiss + s.unmanaged)')
          if [ "$n" -gt 0 ]; then
            echo "title=Review history refresh: $n rule(s) need attention" >> "$GITHUB_OUTPUT"
          else
            echo "title=Review history refresh" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: refresh PR review history"
          title: ${{ steps.status.outputs.title }}
          body-path: ${{ runner.temp }}/status.md
          branch: chore/reviewlore-refresh
          delete-branch: true
