# Copy this file into your repo as .github/workflows/regenerate-heuristic-rules.yml
#
# For teams without the Claude Code plugin: regenerates rules with the
# heuristic generator. With the plugin, use refresh-review-corpus.yml
# instead — rules written by the plugin are never overwritten here.
#
# Runs reviewlore on a schedule (or on demand via workflow_dispatch),
# regenerates the AI-tool rule files, opens a PR if anything changed.
#
# Setup:
#   1. Copy this file to .github/workflows/ in your repo.
#   2. Set FORMAT below to your tool(s). OWNER and REPO come from the repo
#      the workflow runs in.
#   3. (Optional) To tune thresholds, add e.g. `--preset team-of-50` to the
#      "Regenerate rules" step (see docs/cli.md#presets).
#   4. (Optional, for --llm synthesis) Add an ANTHROPIC_API_KEY repo secret,
#      then add `ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}` under
#      that step's env and `--llm` to its command.
#   5. The permissions block already grants write to contents + pull-requests
#      so the workflow can open a PR.

name: Regenerate PR-feedback rules

on:
  # Weekly on Monday at 6am UTC. Adjust the cron to taste.
  schedule:
    - cron: "0 6 * * 1"
  # Manual trigger from the Actions tab.
  workflow_dispatch:
    inputs:
      months:
        description: "Lookback window (months)"
        default: "6"

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      FORMAT: claude               # or: cursor, copilot, agents, contributing, html, all
      MONTHS: ${{ github.event.inputs.months || '6' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install reviewlore
        run: npm install -g reviewlore

      - name: Restore reviewlore's cache from earlier runs
        # Each run saves a new cache entry (keys are immutable) and restores
        # the newest one, so weekly fetches only download what's new.
        uses: actions/cache@v4
        with:
          path: ~/.reviewlore
          key: reviewlore-${{ github.repository }}-${{ github.run_id }}
          restore-keys: reviewlore-${{ github.repository }}-

      - name: Seed the cache from the committed corpus
        # Only when no earlier run's cache was restored. The corpus records
        # when it was last fetched, so the fetch below still only downloads
        # what's new.
        run: |
          if [ -f .reviewlore-corpus.json ] && [ ! -f ~/.reviewlore/"${OWNER}__${REPO}.json" ]; then
            mkdir -p ~/.reviewlore
            cp .reviewlore-corpus.json ~/.reviewlore/"${OWNER}__${REPO}.json"
          fi

      - name: Fetch PR comments (bot has token; everyone else won't need one)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewlore fetch \
            --owner "$OWNER" --repo "$REPO" --cache --no-output \
            --months "$MONTHS"

      - name: Publish corpus into the repo
        # Writes .reviewlore-corpus.json so teammates and CI
        # downstream can run reviewlore with no token.
        run: |
          reviewlore publish-corpus \
            --owner "$OWNER" --repo "$REPO" --target . --force

      - name: Regenerate rules from the in-repo corpus
        # --no-cache: the corpus was just published; don't fetch again.
        run: |
          reviewlore run \
            --target . \
            --format "$FORMAT" \
            --months "$MONTHS" \
            --no-cache \
            --force

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(rules): regenerate from PR feedback"
          title: "Refresh AI-tool rules from recent PR feedback"
          body: |
            Auto-regenerated by `reviewlore` from the last few months
            of PR review activity.

            Review the diff — heuristic clustering produces false positives.
            Delete or edit any rule that looks wrong; the next run will skip
            existing files unless `--force` is passed (we pass it here so the
            generated content stays current with the corpus — if you want
            certain rules pinned, take them out of `.claude/rules/` /
            `.cursor/rules/` and put them in a manually-maintained file).
          branch: chore/reviewlore-refresh
          delete-branch: true
